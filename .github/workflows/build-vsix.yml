name: Build VSIX

# Builds the RXDK VS Code extension (.vsix) on every push to main and republishes it
# as the repo's moving "latest" GitHub Release, so .../RXDK-VSCode/releases/latest always
# serves the newest build. A v* tag instead makes a permanent, versioned release.
# Host tools are NOT bundled — the extension downloads them per-platform at runtime
# (src/hostTools.ts) — so the workflow just produces and publishes the .vsix. Mirrors
# RXDK-VS20XX's build-vsix.yml.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the moving "latest" GitHub Release (same as a push to main)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --allow-star-activation

      - name: Locate VSIX
        id: vsix
        run: |
          set -euo pipefail
          vsix="$(ls rxdk-vscode-*.vsix | head -n1)"
          [ -n "$vsix" ] || { echo 'VSIX not found after build' >&2; exit 1; }
          echo "name=${vsix}" >> "$GITHUB_OUTPUT"
          mb=$(awk "BEGIN{printf \"%.2f\", $(stat -c%s "$vsix")/1048576}")
          {
            echo '### RXDK for VS Code -- VSIX build'
            echo ''
            echo '| Artifact | Size |'
            echo '|----------|------|'
            echo "| \`${vsix}\` | ${mb} MB |"
            echo ''
            echo 'Install: download the `.vsix` and use **Extensions -> ... -> Install from VSIX...**, or `code --install-extension <file>`.'
            echo 'Host tools are downloaded per-platform at runtime; Xbox headers/libs come from RXDK-SDK.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: rxdk-vscode-vsix
          path: rxdk-vscode-*.vsix
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: |
      github.event_name != 'pull_request' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download VSIX artifact
        uses: actions/download-artifact@v5
        with:
          name: rxdk-vscode-vsix
          path: dist

      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # An explicit v* tag makes a permanent, versioned release.
            tag="${GITHUB_REF#refs/tags/}"; moving=false
          else
            # Push to main (or a manual publish): move a single "latest" release to
            # this build so /releases/latest always serves the newest VSIX.
            tag="latest"; moving=true
          fi
          echo "tag=${tag}"       >> "$GITHUB_OUTPUT"
          echo "moving=${moving}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag} (moving=${moving})"

      - name: Move the 'latest' tag/release to this build
        if: steps.meta.outputs.moving == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Delete any prior "latest" release AND its git tag so the create step recreates
        # both at this commit (gh won't move an existing tag). Non-fatal on first run.
        run: gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.vsix)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No VSIX in dist/" >&2
            exit 1
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${GITHUB_SHA}" \
            --title "RXDK for VS Code ${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            --latest \
            "${files[@]}"

      - name: Write release summary
        run: |
          {
            echo "### GitHub Release"
            echo ""
            echo "- Tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- Moving latest: \`${{ steps.meta.outputs.moving }}\`"
            echo "- Asset: \`*.vsix\` (Install from VSIX in VS Code / Cursor)"
          } >> "$GITHUB_STEP_SUMMARY"
